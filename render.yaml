services:
  - type: web
    name: gobet
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    disk:
      name: gobet-user-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GOBET_USERS_FILE
        value: /var/data/users.json
      - key: GOBET_SECRET_KEY
        generateValue: true
      - key: GOBET_COOKIE_SECURE
        value: "true"